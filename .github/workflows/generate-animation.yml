name: Generate Hacker Binary Mask Animation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate animated SVG
        run: |
          mkdir -p dist
          cat << 'EOF' > dist/hacker-mask-animation.svg
          <svg width="800" height="450"
               viewBox="0 0 800 450"
               xmlns="http://www.w3.org/2000/svg">

            <defs>
              <!-- Forbidden face zone -->
              <mask id="faceMask">
                <rect width="100%" height="100%" fill="white"/>
                <ellipse cx="400" cy="210" rx="95" ry="120" fill="black"/>
              </mask>

              <!-- Neon glow -->
              <filter id="glow">
                <feGaussianBlur stdDeviation="2" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <!-- Background -->
            <rect width="100%" height="100%" fill="black"/>

            <!-- ================= BINARY RAIN ================= -->
            <g mask="url(#faceMask)"
               font-family="monospace"
               font-size="16"
               fill="#00ccff"
               filter="url(#glow)">

              <!-- TOP → DOWN -->
              <text x="40" y="-200">10101010
                <animateTransform type="translate" from="0 -600" to="0 700" dur="6s" begin="0s" repeatCount="indefinite"/>
              </text>
              <text x="110" y="-300">11001100
                <animateTransform type="translate" from="0 -700" to="0 800" dur="9s" begin="1s" repeatCount="indefinite"/>
              </text>
              <text x="190" y="-150">00110101
                <animateTransform type="translate" from="0 -500" to="0 600" dur="5s" begin="2s" repeatCount="indefinite"/>
              </text>
              <text x="260" y="-250">01010111
                <animateTransform type="translate" from="0 -650" to="0 750" dur="8s" begin="0.5s" repeatCount="indefinite"/>
              </text>
              <text x="620" y="-300">11100011
                <animateTransform type="translate" from="0 -700" to="0 800" dur="7s" begin="1.5s" repeatCount="indefinite"/>
              </text>
              <text x="700" y="-180">10011001
                <animateTransform type="translate" from="0 -550" to="0 650" dur="6.5s" begin="2.5s" repeatCount="indefinite"/>
              </text>

              <!-- BOTTOM → UP -->
              <text x="90" y="650">01001010
                <animateTransform type="translate" from="0 700" to="0 -800" dur="7s" begin="0s" repeatCount="indefinite"/>
              </text>
              <text x="160" y="750">11101001
                <animateTransform type="translate" from="0 800" to="0 -900" dur="10s" begin="1s" repeatCount="indefinite"/>
              </text>
              <text x="230" y="600">00011101
                <animateTransform type="translate" from="0 650" to="0 -750" dur="6s" begin="2s" repeatCount="indefinite"/>
              </text>
              <text x="520" y="720">10100111
                <animateTransform type="translate" from="0 780" to="0 -850" dur="8s" begin="1.5s" repeatCount="indefinite"/>
              </text>
              <text x="600" y="680">01101010
                <animateTransform type="translate" from="0 700" to="0 -800" dur="9s" begin="0.8s" repeatCount="indefinite"/>
              </text>

            </g>

            <!-- ================= FACE ================= -->
            <ellipse cx="400" cy="210" rx="95" ry="120"
                     fill="#0a0a0a"
                     stroke="#00ffcc"
                     stroke-width="2"/>

            <!-- Circuit cross -->
            <g stroke="#00ccff" stroke-width="1">
              <line x1="400" y1="90" x2="400" y2="330"/>
              <line x1="305" y1="210" x2="495" y2="210"/>
            </g>

            <!-- Eyes -->
            <rect x="350" y="190" width="25" height="8" fill="#00ffcc">
              <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
            </rect>
            <rect x="425" y="190" width="25" height="8" fill="#00ffcc">
              <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
            </rect>

            <!-- Footer -->
            <text x="250" y="420"
                  fill="#00ffcc"
                  font-family="monospace"
                  font-size="16">
              WELCOME, alvithops — SYSTEM ONLINE
            </text>

          </svg>
          EOF

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
