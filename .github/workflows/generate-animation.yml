name: Generate Hacker Matrix Animation FIXED

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup directory
        run: mkdir -p dist

      - name: Generate SVG with Moving Binary
        run: |
          cat > dist/hacker-mask-animation.svg << 'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="500" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style type="text/css">
      <![CDATA[
        @keyframes rainDown {
          0% { transform: translateY(-100px); opacity: 0; }
          10% { opacity: 1; }
          90% { opacity: 1; }
          100% { transform: translateY(600px); opacity: 0; }
        }
        .matrix-text {
          font-family: 'Courier New', monospace;
          font-size: 16px;
          fill: #00ff66;
          font-weight: bold;
        }
      ]]>
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="#000000"/>
  
  <!-- Matrix Rain Columns -->
  <!-- Column 1 -->
  <g class="matrix-text">
    <text x="50" y="0">
      <tspan x="50" dy="0">1010101010</tspan>
      <animate attributeName="y" from="0" to="600" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="50" y="-50">
      <tspan x="50" dy="0">0101010101</tspan>
      <animate attributeName="y" from="-50" to="550" dur="5s" begin="1s" repeatCount="indefinite"/>
    </text>
  </g>
  
  <!-- Column 2 -->
  <g class="matrix-text">
    <text x="150" y="0">
      <tspan x="150" dy="0">1100110011</tspan>
      <animate attributeName="y" from="0" to="600" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="150" y="-60">
      <tspan x="150" dy="0">0011001100</tspan>
      <animate attributeName="y" from="-60" to="540" dur="4s" begin="0.5s" repeatCount="indefinite"/>
    </text>
  </g>
  
  <!-- Column 3 -->
  <g class="matrix-text">
    <text x="250" y="0">
      <tspan x="250" dy="0">1010101010</tspan>
      <animate attributeName="y" from="0" to="600" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="250" y="-40">
      <tspan x="250" dy="0">0101010101</tspan>
      <animate attributeName="y" from="-40" to="560" dur="6s" begin="2s" repeatCount="indefinite"/>
    </text>
  </g>
  
  <!-- Column 4 -->
  <g class="matrix-text">
    <text x="350" y="0">
      <tspan x="350" dy="0">1100110011</tspan>
      <animate attributeName="y" from="0" to="600" dur="3.5s" repeatCount="indefinite"/>
    </text>
    <text x="350" y="-30">
      <tspan x="350" dy="0">0011001100</tspan>
      <animate attributeName="y" from="-30" to="570" dur="3.5s" begin="1.5s" repeatCount="indefinite"/>
    </text>
  </g>
  
  <!-- Column 5 -->
  <g class="matrix-text">
    <text x="450" y="0">
      <tspan x="450" dy="0">0101010101</tspan>
      <animate attributeName="y" from="0" to="600" dur="5.5s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="-70">
      <tspan x="450" dy="0">1010101010</tspan>
      <animate attributeName="y" from="-70" to="530" dur="5.5s" begin="0.8s" repeatCount="indefinite"/>
    </text>
  </g>
  
  <!-- Column 6 -->
  <g class="matrix-text">
    <text x="550" y="0">
      <tspan x="550" dy="0">1100110011</tspan>
      <animate attributeName="y" from="0" to="600" dur="4.5s" repeatCount="indefinite"/>
    </text>
    <text x="550" y="-20">
      <tspan x="550" dy="0">0011001100</tspan>
      <animate attributeName="y" from="-20" to="580" dur="4.5s" begin="1.2s" repeatCount="indefinite"/>
    </text>
  </g>
  
  <!-- Column 7 -->
  <g class="matrix-text">
    <text x="650" y="0">
      <tspan x="650" dy="0">1010101010</tspan>
      <animate attributeName="y" from="0" to="600" dur="7s" repeatCount="indefinite"/>
    </text>
    <text x="650" y="-90">
      <tspan x="650" dy="0">0101010101</tspan>
      <animate attributeName="y" from="-90" to="510" dur="7s" begin="3s" repeatCount="indefinite"/>
    </text>
  </g>
  
  <!-- Column 8 -->
  <g class="matrix-text">
    <text x="750" y="0">
      <tspan x="750" dy="0">1100110011</tspan>
      <animate attributeName="y" from="0" to="600" dur="4.2s" repeatCount="indefinite"/>
    </text>
    <text x="750" y="-100">
      <tspan x="750" dy="0">0011001100</tspan>
      <animate attributeName="y" from="-100" to="500" dur="4.2s" begin="2.1s" repeatCount="indefinite"/>
    </text>
  </g>
  
  <!-- Column 9 -->
  <g class="matrix-text">
    <text x="850" y="0">
      <tspan x="850" dy="0">0101010101</tspan>
      <animate attributeName="y" from="0" to="600" dur="6.5s" repeatCount="indefinite"/>
    </text>
    <text x="850" y="-80">
      <tspan x="850" dy="0">1010101010</tspan>
      <animate attributeName="y" from="-80" to="520" dur="6.5s" begin="1.8s" repeatCount="indefinite"/>
    </text>
  </g>
  
  <!-- Joker Mask -->
  <g id="mask">
    <ellipse cx="450" cy="250" rx="130" ry="160" fill="#0a0a0a" stroke="#00ff66" stroke-width="2"/>
    
    <!-- Eyes -->
    <rect x="390" y="235" width="30" height="10" fill="#00ff66">
      <animate attributeName="height" values="10;12;10" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="480" y="235" width="30" height="10" fill="#00ff66">
      <animate attributeName="height" values="10;12;10" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Smile -->
    <path d="M390 300 Q450 340 510 300" stroke="#00ff66" stroke-width="3" fill="none">
      <animate attributeName="d" 
               values="M390 300 Q450 340 510 300;
                       M390 305 Q450 345 510 305;
                       M390 300 Q450 340 510 300"
               dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Scan Line -->
  <rect x="0" y="0" width="900" height="1" fill="#00ff66" opacity="0.5">
    <animate attributeName="y" from="0" to="500" dur="2s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Footer -->
  <text x="260" y="480" font-family="monospace" font-size="18" fill="#00ff66">
    SYSTEM ONLINE — alvithops
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </text>
  
  <!-- Binary Scrolling Text -->
  <text x="900" y="495" font-family="monospace" font-size="12" fill="#00ff66" opacity="0.4">
    010010000100000101000011010010110100010101010010
    <animate attributeName="x" from="900" to="-800" dur="15s" repeatCount="indefinite"/>
  </text>
</svg>
EOF

      - name: Create HTML Preview
        run: |
          cat > dist/index.html << 'EOF'
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacker Matrix Animation</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            color: #00ff66;
        }
        .container {
            max-width: 900px;
            text-align: center;
        }
        h1 {
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00ff66;
        }
        .info {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #00ff66;
            background: rgba(0, 255, 102, 0.1);
            border-radius: 5px;
        }
        .status {
            color: #00ff66;
            margin: 10px 0;
        }
        .updated {
            color: #888;
            font-size: 0.9em;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ Hacker Matrix Animation ⚡</h1>
        <div>
            <object type="image/svg+xml" data="hacker-mask-animation.svg" width="900" height="500">
                Your browser doesn't support SVG
            </object>
        </div>
        <div class="info">
            <div class="status">✅ Animation is running</div>
            <div>Binary code streams are moving vertically</div>
            <div>Mask elements have subtle animations</div>
            <div class="updated">Last updated: <span id="timestamp"></span></div>
        </div>
    </div>
    
    <script>
        document.getElementById('timestamp').textContent = new Date().toLocaleString();
        
        // Auto-refresh SVG every 10 seconds to ensure animations keep running
        setInterval(() => {
            const svgObject = document.querySelector('object');
            if (svgObject) {
                svgObject.data = svgObject.data;
            }
        }, 10000);
    </script>
</body>
</html>
EOF

      - name: Create README for output branch
        run: |
          cat > dist/README.md << 'EOF'
# Hacker Matrix Animation

This repository contains an automatically generated SVG animation with moving binary code and a hacker-style joker mask.

## Features
- ✅ Animated binary code rain (Matrix-style)
- ✅ Joker mask with animated eyes and smile
- ✅ Scan line effect
- ✅ Scrolling binary text at bottom
- ✅ Auto-refreshing SVG animation

## View Animation
Open `index.html` in your browser to see the animation.

## Technical Details
- **Format**: SVG with SMIL animations
- **Size**: 900x500 pixels
- **Colors**: Green (#00ff66) on black
- **Animation Types**: Vertical movement, opacity changes, path morphing

## How It Works
1. Binary streams move from top to bottom at different speeds
2. Mask elements have subtle animations
3. Scan line sweeps across the screen
4. All animations loop indefinitely

## Auto-generation
This animation is automatically regenerated every 6 hours via GitHub Actions.

---
*Generated by GitHub Actions workflow*
EOF

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          keep_files: false
          force_orphan: true

      - name: Display success message
        run: |
          echo "✅ SVG animation generated successfully!"
          echo "📁 Published to: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
