# File: .github/workflows/generate-animation.yml
name: alvithops

on:
  push:
    paths:
      - "alvithops.yaml"
      - "README.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate SVG from YAML
        run: |
          echo "Generating hacker-mask-animation.svg from alvithops.yaml"
          cat << 'EOF' > hacker-mask-animation.svg
          <svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <style>
                .bg { fill: black; }
                .text { fill: #00ff88; font-family: monospace; font-size: 20px; }
              </style>
            </defs>

            <rect width="800" height="300" class="bg" />

            <!-- Hacker Mask -->
            <circle cx="400" cy="140" r="60" fill="#111" stroke="#00ff88" stroke-width="3">
              <animateTransform
                attributeName="transform"
                type="rotate"
                from="-5 400 140"
                to="5 400 140"
                dur="4s"
                repeatCount="indefinite" />
            </circle>

            <!-- Eyes -->
            <rect x="370" y="130" width="15" height="8" fill="#00ff88">
              <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
            </rect>
            <rect x="415" y="130" width="15" height="8" fill="#00ff88">
              <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
            </rect>

            <!-- Text -->
            <text x="260" y="250" class="text">WELCOME, alvithops</text>
            <text x="260" y="275" class="text">SYSTEM ONLINE</text>

            <!-- Glitch Effect -->
            <rect x="0" y="0" width="800" height="300" fill="#00ff88" opacity="0">
              <animate attributeName="opacity" values="0;0.15;0" dur="0.15s" repeatCount="indefinite" begin="6s" />
            </rect>
          </svg>
          EOF

      - name: Commit and push SVG
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add hacker-mask-animation.svg
          git commit -m "auto: generate hacker mask animation" || echo "No changes"
          git push


