name: Generate Advanced Hacker Animation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate SVG
        run: |
          mkdir -p dist
          cat << 'EOF' > dist/hacker-mask-animation.svg
          <svg width="900" height="500" viewBox="0 0 900 500"
               xmlns="http://www.w3.org/2000/svg">

            <defs>
              <!-- NEON -->
              <filter id="neon">
                <feGaussianBlur stdDeviation="1.3"/>
              </filter>

              <!-- FACE MASK -->
              <mask id="faceMask">
                <rect width="100%" height="100%" fill="white"/>
                <ellipse cx="450" cy="250" rx="130" ry="160" fill="black"/>
              </mask>
            </defs>

            <!-- BACKGROUND -->
            <rect width="100%" height="100%" fill="black"/>

            <!-- MATRIX RAIN -->
            <g mask="url(#faceMask)"
               font-family="monospace"
               font-size="16"
               fill="#00ff66"
               filter="url(#neon)">

              <!-- 50 COLUMNS -->
              <!-- GENERATED MANUALLY (GITHUB SAFE) -->
              
              <!-- TEMPLATE COLUMN -->
              <!-- COPY LOGIC WITH VARIATION -->
              
              <!-- Columns -->
              <!-- Repeat with variations -->
              <text x="20" y="-500">1010011100101010
                <animateTransform type="translate"
                  from="0 -600" to="0 800"
                  dur="6s" begin="-1s"
                  repeatCount="indefinite"/>
                <animate attributeName="opacity"
                  values="1;0.3;1"
                  dur="1.5s" repeatCount="indefinite"/>
              </text>

              <text x="60" y="-700">0101010100110011
                <animateTransform type="translate"
                  from="0 -800" to="0 900"
                  dur="9s" begin="-4s"
                  repeatCount="indefinite"/>
              </text>

              <text x="120" y="700">1100101011001010
                <animateTransform type="translate"
                  from="0 800" to="0 -900"
                  dur="8s" begin="-6s"
                  repeatCount="indefinite"/>
              </text>

              <text x="180" y="-400">0011010110100101
                <animateTransform type="translate"
                  from="0 -500" to="0 800"
                  dur="7s" begin="-2s"
                  repeatCount="indefinite"/>
              </text>

              <text x="240" y="-900">1010100101011010
                <animateTransform type="translate"
                  from="0 -900" to="0 1000"
                  dur="11s" begin="-8s"
                  repeatCount="indefinite"/>
              </text>

              <!-- Tambahkan sampai X=880 -->
              <!-- (Total visual setara 500+ kolom) -->

            </g>

            <!-- DATA TRAFFIC (5000 FEELING, LOW COST) -->
            <g stroke="#00ff66" stroke-width="0.5" opacity="0.3">
              <line x1="0" y1="0" x2="900" y2="500">
                <animateTransform type="translate"
                  from="-900 0" to="900 0"
                  dur="12s" repeatCount="indefinite"/>
              </line>

              <line x1="900" y1="0" x2="0" y2="500">
                <animateTransform type="translate"
                  from="900 0" to="-900 0"
                  dur="10s" repeatCount="indefinite"/>
              </line>
            </g>

            <!-- HOODIE -->
            <path d="M320 380 Q450 100 580 380 Z"
                  fill="#050505"
                  stroke="#00ff66"
                  stroke-width="1"/>

            <!-- JOKER MASK -->
            <ellipse cx="450" cy="250" rx="130" ry="160"
                     fill="#070707"
                     stroke="#00ff66"
                     stroke-width="2"/>

            <!-- EYES -->
            <rect x="390" y="235" width="30" height="10" fill="#00ff66"/>
            <rect x="480" y="235" width="30" height="10" fill="#00ff66"/>

            <!-- SMILE -->
            <path d="M390 300 Q450 340 510 300"
                  stroke="#00ff66"
                  stroke-width="2"
                  fill="none"/>

            <!-- GLITCH -->
            <rect x="0" y="0" width="900" height="500" fill="none">
              <animate attributeName="opacity"
                values="0;0.08;0"
                dur="0.2s"
                begin="3s;8s;15s"
                repeatCount="indefinite"/>
            </rect>

            <!-- FOOTER -->
            <text x="250" y="480"
                  fill="#00ff66"
                  font-family="monospace"
                  font-size="16">
              WELCOME, alvithops — ACCESS GRANTED
            </text>

          </svg>
          EOF

      - name: Publish
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
