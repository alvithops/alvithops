name: Generate Hacker Animation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate SVG animation
        run: |
          mkdir -p dist

          echo '<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">' > dist/hacker-mask-animation.svg
          echo '<rect width="100%" height="100%" fill="black"/>' >> dist/hacker-mask-animation.svg

          # MASK WAJAH (AREA DALAM TOPENG)
          cat <<'EOF' >> dist/hacker-mask-animation.svg
          <defs>
            <mask id="jokerMask">
              <rect width="100%" height="100%" fill="black"/>
              <ellipse cx="400" cy="300" rx="140" ry="190" fill="white"/>
            </mask>
          </defs>
          EOF

          # === AREA WAJAH (HOODIE + JOKER) ===
          cat <<'EOF' >> dist/hacker-mask-animation.svg
          <g mask="url(#jokerMask)">
            <ellipse cx="400" cy="300" rx="140" ry="190" fill="#111"/>
            <path d="M260 520 Q400 380 540 520" fill="#0a0a0a"/>
            <ellipse cx="350" cy="270" rx="18" ry="8" fill="#00ff66"/>
            <ellipse cx="450" cy="270" rx="18" ry="8" fill="#00ff66"/>
            <path d="M340 340 Q400 370 460 340" stroke="#00ff66" stroke-width="4" fill="none"/>
          </g>
          EOF

          # === BINARY RAIN (HIJAU NEON, DI DALAM WAJAH) ===
          echo '<g mask="url(#jokerMask)" font-family="monospace" font-size="14" fill="#00ff66" opacity="0.85">' >> dist/hacker-mask-animation.svg
          for i in {1..180}; do
            x=$((RANDOM % 800))
            y=$((RANDOM % 600))
            dur=$((5 + RANDOM % 10))
            bin=$(shuf -i0-1 -n20 | tr -d '\n')
            echo "<text x=\"$x\" y=\"-$y\">$bin
              <animateTransform type=\"translate\" from=\"0 -700\" to=\"0 900\" dur=\"${dur}s\" repeatCount=\"indefinite\"/>
            </text>" >> dist/hacker-mask-animation.svg
          done
          echo '</g>' >> dist/hacker-mask-animation.svg

          # === LINTAS DATA 5000 (DI LUAR TOPENG) ===
          echo '<g mask="none" stroke="#00ff66" stroke-width="1" opacity="0.15">' >> dist/hacker-mask-animation.svg
          for i in {1..5000}; do
            x1=$((RANDOM % 800))
            y1=$((RANDOM % 600))
            x2=$((RANDOM % 800))
            y2=$((RANDOM % 600))
            dx=$((RANDOM % 400 - 200))
            dy=$((RANDOM % 400 - 200))
            dur=$((4 + RANDOM % 12))
            echo "<line x1=\"$x1\" y1=\"$y1\" x2=\"$x2\" y2=\"$y2\">
              <animateTransform type=\"translate\" from=\"0 0\" to=\"$dx $dy\" dur=\"${dur}s\" repeatCount=\"indefinite\"/>
            </line>" >> dist/hacker-mask-animation.svg
          done
          echo '</g>' >> dist/hacker-mask-animation.svg

          echo '</svg>' >> dist/hacker-mask-animation.svg

      - name: Publish SVG
        run: |
          git checkout --orphan output
          git rm -rf .
          mv dist/hacker-mask-animation.svg .
          git add hacker-mask-animation.svg
          git commit -m "Generate hacker animation"
          git push -f origin output
