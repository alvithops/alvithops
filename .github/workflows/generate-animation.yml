name: Generate Binary Animation GIF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generate frames
        run: |
          mkdir frames
          for i in $(seq 0 19); do
            convert -size 900x500 xc:black \
              -fill '#00ff66' -font Courier -pointsize 20 \
              -draw "text 40,$((i*25%500)) '10101010101010101010'" \
              -draw "text 90,$(((i*35+100)%500)) '01010101010101010101'" \
              -draw "text 140,$(((i*45+200)%500)) '11001100110011001100'" \
              frames/frame_$i.png
          done

      - name: Create GIF
        run: |
          convert -delay 8 -loop 0 frames/frame_*.png dist.gif

      - name: Commit GIF
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add dist.gif
          git commit -m "update binary animation" || true
          git push
