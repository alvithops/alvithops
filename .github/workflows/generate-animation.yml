name: Generate Hacker Matrix Animation SIMPLE

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate SVG with Simple Moving Binary
        run: |
          mkdir -p dist
          cat << 'EOF' > dist/hacker-mask-animation.svg
<svg width="900" height="500"
     viewBox="0 0 900 500"
     xmlns="http://www.w3.org/2000/svg">

  <rect width="100%" height="100%" fill="black"/>

  <!-- SIMPLE MATRIX RAIN -->
  <style>
    @keyframes rain {
      0% { transform: translateY(-100px); opacity: 0; }
      5% { opacity: 1; }
      95% { opacity: 1; }
      100% { transform: translateY(600px); opacity: 0; }
    }
    
    .binary-rain {
      font-family: 'Courier New', monospace;
      font-size: 18px;
      fill: #00ff66;
      animation: rain linear infinite;
    }
  </style>

  <!-- Multiple binary streams -->
  <g>
    <!-- Column 1 -->
    <text x="50" y="0" class="binary-rain" style="animation-duration: 4s">1010101010</text>
    <text x="50" y="-100" class="binary-rain" style="animation-duration: 4s; animation-delay: 0.5s">0101010101</text>
    <text x="50" y="-200" class="binary-rain" style="animation-duration: 4s; animation-delay: 1s">1100110011</text>
    
    <!-- Column 2 -->
    <text x="150" y="0" class="binary-rain" style="animation-duration: 5s">0011001100</text>
    <text x="150" y="-150" class="binary-rain" style="animation-duration: 5s; animation-delay: 0.7s">1010101010</text>
    <text x="150" y="-300" class="binary-rain" style="animation-duration: 5s; animation-delay: 1.4s">0101010101</text>
    
    <!-- Column 3 -->
    <text x="250" y="0" class="binary-rain" style="animation-duration: 3.5s">1100110011</text>
    <text x="250" y="-80" class="binary-rain" style="animation-duration: 3.5s; animation-delay: 0.3s">0011001100</text>
    <text x="250" y="-160" class="binary-rain" style="animation-duration: 3.5s; animation-delay: 0.6s">1010101010</text>
    
    <!-- Column 4 -->
    <text x="350" y="0" class="binary-rain" style="animation-duration: 6s">0101010101</text>
    <text x="350" y="-200" class="binary-rain" style="animation-duration: 6s; animation-delay: 2s">1100110011</text>
    
    <!-- Column 5 -->
    <text x="450" y="0" class="binary-rain" style="animation-duration: 4.5s">1010101010</text>
    <text x="450" y="-120" class="binary-rain" style="animation-duration: 4.5s; animation-delay: 1.5s">0101010101</text>
    
    <!-- Column 6 -->
    <text x="550" y="0" class="binary-rain" style="animation-duration: 5.5s">0011001100</text>
    <text x="550" y="-180" class="binary-rain" style="animation-duration: 5.5s; animation-delay: 1.8s">1100110011</text>
    
    <!-- Column 7 -->
    <text x="650" y="0" class="binary-rain" style="animation-duration: 3.8s">1010101010</text>
    <text x="650" y="-90" class="binary-rain" style="animation-duration: 3.8s; animation-delay: 0.9s">0101010101</text>
    
    <!-- Column 8 -->
    <text x="750" y="0" class="binary-rain" style="animation-duration: 4.2s">0011001100</text>
    <text x="750" y="-110" class="binary-rain" style="animation-duration: 4.2s; animation-delay: 1.1s">1010101010</text>
    
    <!-- Column 9 -->
    <text x="850" y="0" class="binary-rain" style="animation-duration: 5.8s">0101010101</text>
    <text x="850" y="-250" class="binary-rain" style="animation-duration: 5.8s; animation-delay: 2.5s">1100110011</text>
  </g>

  <!-- JOKER MASK -->
  <ellipse cx="450" cy="250" rx="130" ry="160"
           fill="#070707"
           stroke="#00ff66"
           stroke-width="2"/>

  <!-- EYES -->
  <rect x="390" y="235" width="30" height="10" fill="#00ff66"/>
  <rect x="480" y="235" width="30" height="10" fill="#00ff66"/>

  <!-- SMILE -->
  <path d="M390 300 Q450 340 510 300"
        stroke="#00ff66"
        stroke-width="2"
        fill="none"/>

  <!-- FOOTER -->
  <text x="260" y="480"
        fill="#00ff66"
        font-family="monospace"
        font-size="16">
    SYSTEM ONLINE — alvithops
  </text>

</svg>
EOF
          echo "✅ Simple SVG with moving binary generated"

      - name: Publish SVG
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
