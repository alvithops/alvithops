name: Generate Hacker Animation

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate hacker SVG
        run: |
          mkdir -p dist
          cat << 'EOF' > dist/hacker-mask-animation.svg
          <svg width="800" height="300" viewBox="0 0 800 300"
               xmlns="http://www.w3.org/2000/svg">

            <rect width="100%" height="100%" fill="black"/>

            <circle cx="400" cy="140" r="60"
                    fill="#111" stroke="#00ff88" stroke-width="3">
              <animateTransform
                attributeName="transform"
                type="rotate"
                from="-6 400 140"
                to="6 400 140"
                dur="4s"
                repeatCount="indefinite"/>
            </circle>

            <rect x="370" y="130" width="15" height="8" fill="#00ff88">
              <animate attributeName="opacity"
                       values="1;0.2;1"
                       dur="2s"
                       repeatCount="indefinite"/>
            </rect>
            <rect x="415" y="130" width="15" height="8" fill="#00ff88">
              <animate attributeName="opacity"
                       values="1;0.2;1"
                       dur="2s"
                       repeatCount="indefinite"/>
            </rect>

            <text x="250" y="250"
                  fill="#00ff88"
                  font-family="monospace"
                  font-size="20">
              WELCOME, alvithops
            </text>

            <text x="250" y="275"
                  fill="#00ff88"
                  font-family="monospace"
                  font-size="16">
              SYSTEM ONLINE
            </text>

          </svg>
          EOF

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
