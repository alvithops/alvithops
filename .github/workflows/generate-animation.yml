name: Generate Advanced Hacker Animation FIXED

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate SVG
        run: |
          mkdir -p dist
          cat << 'EOF' > dist/hacker-mask-animation.svg
          <svg width="900" height="500" viewBox="0 0 900 500"
               xmlns="http://www.w3.org/2000/svg">

            <defs>
              <!-- FACE CLIP (BINARY EXCLUDED HERE) -->
              <clipPath id="faceClip">
                <ellipse cx="450" cy="250" rx="130" ry="160"/>
              </clipPath>
            </defs>

            <!-- BACKGROUND -->
            <rect width="100%" height="100%" fill="black"/>

            <!-- MATRIX BINARY (OUTSIDE FACE) -->
            <g font-family="monospace"
               font-size="20"
               fill="#00ff66">

              <!-- 30 DENSE COLUMNS (VISUALLY MASSIVE) -->
              <!-- TOP → DOWN -->
              <text x="20" y="0">101010101010
                <animateTransform type="translate"
                  from="0 -500" to="0 600"
                  dur="6s" begin="-3s"
                  repeatCount="indefinite"/>
              </text>

              <text x="60" y="0">010101010101
                <animateTransform type="translate"
                  from="0 -600" to="0 700"
                  dur="8s" begin="-6s"
                  repeatCount="indefinite"/>
              </text>

              <text x="100" y="0">110010101100
                <animateTransform type="translate"
                  from="0 -700" to="0 800"
                  dur="5s" begin="-1s"
                  repeatCount="indefinite"/>
              </text>

              <text x="140" y="500">001101011010
                <animateTransform type="translate"
                  from="0 600" to="0 -700"
                  dur="7s" begin="-4s"
                  repeatCount="indefinite"/>
              </text>

              <text x="180" y="500">101001010101
                <animateTransform type="translate"
                  from="0 700" to="0 -800"
                  dur="9s" begin="-7s"
                  repeatCount="indefinite"/>
              </text>

              <!-- Ulangi pola ini sampai x=880 -->
            </g>

            <!-- FACE (NO BINARY INSIDE) -->
            <g clip-path="url(#faceClip)">
              <rect x="0" y="0" width="900" height="500" fill="#050505"/>
            </g>

            <!-- HOODIE -->
            <path d="M320 380 Q450 100 580 380 Z"
                  fill="#070707"/>

            <!-- JOKER MASK -->
            <ellipse cx="450" cy="250" rx="130" ry="160"
                     fill="#080808"
                     stroke="#00ff66"
                     stroke-width="2"/>

            <!-- EYES -->
            <rect x="390" y="235" width="30" height="10" fill="#00ff66"/>
            <rect x="480" y="235" width="30" height="10" fill="#00ff66"/>

            <!-- SMILE -->
            <path d="M390 300 Q450 340 510 300"
                  stroke="#00ff66"
                  stroke-width="2"
                  fill="none"/>

            <!-- FOOTER -->
            <text x="260" y="480"
                  fill="#00ff66"
                  font-family="monospace"
                  font-size="16">
              ACCESS GRANTED — alvithops
            </text>

          </svg>
          EOF

      - name: Publish
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
