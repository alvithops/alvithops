name: Generate Hacker Matrix Animation FIXED

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate SVG
        run: |
          mkdir -p dist
          cat << 'EOF' > dist/hacker-mask-animation.svg
<svg width="900" height="500"
     viewBox="0 0 900 500"
     xmlns="http://www.w3.org/2000/svg">

  <rect width="100%" height="100%" fill="black"/>

  <!-- MATRIX BINARY -->
  <g font-family="monospace" font-size="18" fill="#00ff66">

    <text x="20" y="0"><![CDATA[
1010101010
0101010101
1100110011
0011001100
1010101010
    ]]>
      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 -500"
        to="0 600"
        dur="6s"
        repeatCount="indefinite"/>
    </text>

    <text x="60" y="0"><![CDATA[
0101010101
1010101010
0011001100
1100110011
0101010101
    ]]>
      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 -600"
        to="0 700"
        dur="8s"
        begin="-3s"
        repeatCount="indefinite"/>
    </text>

    <text x="100" y="500"><![CDATA[
1100110011
0011001100
1010101010
0101010101
1100110011
    ]]>
      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 600"
        to="0 -700"
        dur="7s"
        begin="-5s"
        repeatCount="indefinite"/>
    </text>

  </g>

  <!-- JOKER MASK -->
  <ellipse cx="450" cy="250" rx="130" ry="160"
           fill="#070707"
           stroke="#00ff66"
           stroke-width="2"/>

  <!-- EYES -->
  <rect x="390" y="235" width="30" height="10" fill="#00ff66"/>
  <rect x="480" y="235" width="30" height="10" fill="#00ff66"/>

  <!-- SMILE -->
  <path d="M390 300 Q450 340 510 300"
        stroke="#00ff66"
        stroke-width="2"
        fill="none"/>

  <!-- FOOTER -->
  <text x="260" y="480"
        fill="#00ff66"
        font-family="monospace"
        font-size="16">
    SYSTEM ONLINE — alvithops
  </text>

</svg>
EOF

      - name: Publish SVG
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
