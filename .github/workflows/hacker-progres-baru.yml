name: Update Hacker Animation

on:
  schedule:
    - cron: '*/30 * * * *' # Berjalan setiap 30 menit
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Execute Animation Script
        run: |
          python -c "
          import re, random

          def update_progress(match):
              label = match.group(1)
              # Generate progress baru antara 10% - 100%
              new_percent = random.randint(10, 100)
              filled = new_percent // 10
              empty = 10 - filled
              bar = '█' * filled + '▒' * empty
              return f'• {label:<18} {bar} {new_percent}%'

          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()

          # Mencari pola bar progress dan mengupdatenya
          new_content = re.sub(r'• ([A-Z_]+)\s+[█▒]+\s+\d+%', update_progress, content)

          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(new_content)
          "

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff-index --quiet HEAD || git commit -m "system: progress updated"
          git push
