# GitHub Actions Workflow for Hacker Animation System
name: Hacker Animation CI/CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging

env:
  NODE_VERSION: '18.x'
  PYTHON_VERSION: '3.10'
  YAML_CONFIG_FILE: 'hacker-animation.yaml'
  DEPLOY_DIR: './dist'

jobs:
  validate-config:
    name: Validate YAML Configuration
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Validate YAML syntax
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install YAML validator
      run: pip install yamllint pyyaml
    
    - name: Check YAML
      run: |
        echo "🔍 Validating ${{ env.YAML_CONFIG_FILE }}"
        if [ ! -f ${{ env.YAML_CONFIG_FILE }} ]; then
          echo "❌ Error: File ${{ env.YAML_CONFIG_FILE }} tidak ditemukan!"
          exit 1
        fi
        yamllint -d relaxed ${{ env.YAML_CONFIG_FILE }}

  build:
    name: Build Animation Package
    runs-on: ubuntu-latest
    needs: validate-config
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Create build directory
      run: |
        mkdir -p ${{ env.DEPLOY_DIR }}
        cp ${{ env.YAML_CONFIG_FILE }} ${{ env.DEPLOY_DIR }}/
    
    - name: Create Engine and HTML
      run: |
        # Membuat file index.html dan engine secara otomatis di folder dist
        cat > ${{ env.DEPLOY_DIR }}/index.html << 'EOF'
        <!DOCTYPE html>
        <html><head><title>Hacker System</title><style>body{background:#000;color:#0f0;font-family:monospace;}</style></head>
        <body><div id="app">Loading Hacker Animation...</div></body></html>
        EOF

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: hacker-animation-build
        path: ${{ env.DEPLOY_DIR }}

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: hacker-animation-build
        path: ./build-output
    
    - name: Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v1
      with:
        path: ./build-output
    
    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v2
