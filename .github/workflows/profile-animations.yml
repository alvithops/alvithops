name: Generate Weather and River Animations

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Generate Heavy Weather Animation (Larger Clouds & More Rain)
      - name: generate-weather-svg
        run: |
          mkdir -p dist
          cat << 'EOF' > dist/weather.svg
          <svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
            <style>
              .cloud { fill: #ecf0f1; filter: drop-shadow(0px 3px 2px rgba(0,0,0,0.3)); }
              .rain { stroke: #3498db; stroke-width: 1.5; stroke-linecap: round; animation: fall 0.6s linear infinite; }
              .bolt { fill: #f1c40f; opacity: 0; animation: flash 3s steps(1) infinite; }
              @keyframes fall { to { transform: translateY(120px); } }
              @keyframes flash { 0%, 90% { opacity: 0; } 92% { opacity: 1; } 94% { opacity: 0; } 96% { opacity: 1; } 98% { opacity: 0; } }
            </style>
            <rect width="100%" height="100%" fill="#0d1117" />
            
            <g transform="translate(40, 30)">
              <path class="cloud" d="M40 30a25 25 0 1 1 0 50h-20a25 25 0 1 1 0-50z" />
              <line class="rain" x1="15" y1="85" x2="15" y2="100" />
              <line class="rain" x1="25" y1="90" x2="25" y2="105" style="animation-delay: 0.2s" />
              <line class="rain" x1="35" y1="85" x2="35" y2="100" style="animation-delay: 0.4s" />
              <line class="rain" x1="45" y1="95" x2="45" y2="110" style="animation-delay: 0.1s" />
            </g>

            <g transform="translate(180, 30)">
              <path class="cloud" d="M40 30a25 25 0 1 1 0 50h-20a25 25 0 1 1 0-50z" />
              <line class="rain" x1="10" y1="85" x2="10" y2="100" style="animation-delay: 0.1s" />
              <line class="rain" x1="20" y1="95" x2="20" y2="110" style="animation-delay: 0.3s" />
              <line class="rain" x1="30" y1="80" x2="30" y2="95" style="animation-delay: 0.5s" />
              <line class="rain" x1="40" y1="90" x2="40" y2="105" style="animation-delay: 0.2s" />
              <line class="rain" x1="50" y1="85" x2="50" y2="100" style="animation-delay: 0.4s" />
              <polygon class="bolt" points="30,85 20,105 30,105 25,125 40,100 30,100 35,85" />
            </g>

            <g transform="translate(340, 30)">
              <path class="cloud" d="M40 30a25 25 0 1 1 0 50h-20a25 25 0 1 1 0-50z" />
              <line class="rain" x1="15" y1="85" x2="15" y2="100" style="animation-delay: 0.3s" />
              <line class="rain" x1="25" y1="95" x2="25" y2="110" style="animation-delay: 0.1s" />
              <line class="rain" x1="35" y1="85" x2="35" y2="100" style="animation-delay: 0.5s" />
              <line class="rain" x1="45" y1="90" x2="45" y2="105" style="animation-delay: 0.2s" />
            </g>

            <g transform="translate(500, 30)">
              <path class="cloud" d="M40 30a25 25 0 1 1 0 50h-20a25 25 0 1 1 0-50z" />
              <line class="rain" x1="10" y1="85" x2="10" y2="100" style="animation-delay: 0.6s" />
              <line class="rain" x1="20" y1="90" x2="20" y2="105" style="animation-delay: 0.2s" />
              <line class="rain" x1="30" y1="85" x2="30" y2="100" style="animation-delay: 0.4s" />
              <line class="rain" x1="40" y1="95" x2="40" y2="110" style="animation-delay: 0.1s" />
              <line class="rain" x1="50" y1="80" x2="50" y2="95" style="animation-delay: 0.5s" />
              <polygon class="bolt" points="30,85 20,105 30,105 25,125 40,100 30,100 35,85" style="animation-delay: 1.5s" />
            </g>
          </svg>
          EOF

      # 2. Generate River Animation
      - name: generate-river-svg
        run: |
          cat << 'EOF' > dist/river.svg
          <svg width="700" height="150" viewBox="0 0 700 150" xmlns="http://www.w3.org/2000/svg">
            <style>
              .river-bg { fill: #0d1117; }
              .wave { fill: #2c3e50; opacity: 0.7; animation: flow 5s linear infinite; }
              .wave-overlay { fill: #3498db; opacity: 0.5; animation: flow 5s linear infinite reverse; }
              @keyframes flow { from { transform: translateX(0); } to { transform: translateX(50px); } }
            </style>
            <rect x="0" y="0" width="700" height="150" class="river-bg" />
            <path id="riverPath" fill="none" d="M0,75 C100,60 200,90 300,75 C400,60 500,90 600,75 C650,70 700,75 700,75 L700,150 L0,150 Z" />
            <g clip-path="url(#riverClip)">
              <path class="wave" d="M-50,80 C0,65 100,95 200,80 C300,65 400,95 500,80 C600,65 700,95 750,80 L750,150 L-50,150 Z" />
              <path class="wave" d="M-10,70 C40,55 140,85 240,70 C340,55 440,85 540,70 C640,55 740,85 790,70 L790,150 L-10,150 Z" style="animation-delay: -2s; animation-duration: 6s;" />
              <path class="wave-overlay" d="M-20,78 C30,63 130,93 230,78 C330,63 430,93 530,78 C630,63 730,93 780,78 L780,150 L-20,150 Z" style="animation-delay: -1s; animation-duration: 4s;" />
            </g>
            <defs><clipPath id="riverClip"><use href="#riverPath" /></clipPath></defs>
          </svg>
          EOF

      # 3. Push to Output Branch
      - name: push-to-output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
