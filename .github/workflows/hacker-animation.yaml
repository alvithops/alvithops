animation:
  metadata:
    title: "Hacker System Dashboard"
    duration: 60
  system_boot:
    animation_spec:
      duration: 5
    keyframes:
      - time: 0
        progress: 0
      - time: 2
        progress: 45
      - time: 5
        progress: 100
  live_feed:
    timelines: ["NETWORK_TRAFFIC", "ENCRYPTION_KEY", "GEOLOCATION"]
  active_processes:
    processes: ["Kernel", "UI_Render", "Socket_Listener", "Auth_Service"]
  dynamic_elements:
    countdown:
      enabled: true
  rendering:
    effects_enabled: ["glitch", "scanlines", "terminal_flicker"]
  interpolation:
    linear: true
