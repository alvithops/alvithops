name: Update GitHub Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate GitHub Streak Stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=alvithops&theme=tokyonight
          path: assets/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "alvithops@gmail.com"
          git add assets/streak.svg
          git commit -m "chore: update github streak stats" || exit 0
          git push
