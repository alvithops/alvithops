name: Update GitHub Stats

on:
  schedule:
    # Menjalankan aksi setiap hari pada pukul 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Memungkinkan Anda menjalankan aksi secara manual dari tab Actions

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Diperlukan izin untuk melakukan commit otomatis ke repository
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate GitHub Streak Stats
        uses: ashutosh00710/github-readme-streak-stats@main
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_ID: alvithops
          theme: tokyonight
          output: assets/streak.svg # Lokasi penyimpanan file SVG hasil generate

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/streak.svg
          git commit -m "chore: update github streak stats" || exit 0
          git push
