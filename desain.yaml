homepage_config:
  name: "Hacker Animation Dashboard"
  theme: "cyberpunk"
  version: "1.0"
  
canvas_settings:
  id: "hackerCanvas"
  width: "100vw"
  height: "100vh"
  background: "linear-gradient(180deg, #001a00 0%, #000500 25%, #000900 50%, #000500 75%, #001a00 100%)"
  z-index: 0
  
animation_elements:
  
  binary_rain:
    enabled: true
    characters: ["0", "1"]
    colors:
      - "#00FF00"  # Hijau neon terang
      - "#00CC00"  # Hijau neon sedang
      - "#009900"  # Hijau tua
      - "#006600"  # Hijau gelap
      - "#33FF33"  # Hijau muda
      - "#66FF66"  # Hijau pastel
    font_size_min: 12
    font_size_max: 20
    speed_min: 1
    speed_max: 5
    density: 80
    trail_effect: true
    trail_length: 15
    opacity_decay: 0.05
    glow_effect: true
    glow_intensity: 2
    
  masked_face:
    enabled: true
    position: "center"
    size: "40%"
    image_path: "/assets/masked_face.png"
    effects:
      - "glitch"
      - "scanlines"
      - "pulse"
    glitch_frequency: 0.05
    glitch_intensity: 2
    scanline_speed: 2
    pulse_interval: 3000
    overlay_color: "#00FF0044"
    
  background_effects:
    matrix_code_rain: true
    hex_grid: true
    particles: true
    data_streams: true
    
    hex_grid_settings:
      color: "#00FF0022"
      line_width: 1
      spacing: 50
      animation_speed: 0.5
      
    particles_settings:
      count: 30
      colors: ["#00FF00", "#00CC00", "#009900"]
      size: 2
      speed: 1
      
    data_streams_settings:
      count: 5
      colors: ["#00FF00AA", "#00CC00AA"]
      speed: 3
      width: 3
      
  terminal_effects:
    enabled: true
    position: "bottom"
    height: "100px"
    background: "#000000AA"
    text_color: "#00FF00"
    border: "1px solid #00FF00"
    commands:
      - "CONNECTING TO MAINFRAME..."
      - "ACCESSING SECURE NETWORK..."
      - "ENCRYPTION: 256-BIT"
      - "STATUS: SECURE"
      - "USER: ANONYMOUS"
    typing_speed: 100
    command_interval: 2000
    
styles:
  global:
    margin: 0
    padding: 0
    overflow: hidden
    font_family: "Courier New, monospace"
    
  container:
    position: "relative"
    width: "100vw"
    height: "100vh"
    
  overlay_text:
    position: "absolute"
    top: "20px"
    left: "50%"
    transform: "translateX(-50%)"
    color: "#00FF00"
    text_align: "center"
    text_shadow: "0 0 10px #00FF00"
    z_index: 10
    
    title:
      font_size: "3rem"
      margin_bottom: "10px"
      
    subtitle:
      font_size: "1.2rem"
      opacity: 0.8
      
  stats_panel:
    position: "absolute"
    top: "20px"
    right: "20px"
    background: "#000000AA"
    border: "1px solid #00FF00"
    padding: "15px"
    color: "#00FF00"
    font_size: "0.9rem"
    z_index: 10
    min_width: "200px"
    
    stats:
      - "SYSTEM: ONLINE"
      - "SECURITY: MAX"
      - "CONNECTION: ENCRYPTED"
      - "UPTIME: 99.9%"
      
  glitch_effects:
    enabled: true
    frequency: 0.01
    intensity: 1
    colors:
      - "#FF00FF"
      - "#00FFFF"
      - "#FFFF00"
      
  audio:
    enabled: true
    background_track: "/audio/cyberpunk_ambient.mp3"
    sound_effects:
      keypress: "/audio/keypress.wav"
      connect: "/audio/connect.wav"
      glitch: "/audio/glitch.wav"
    volume: 0.3
    
keyboard_shortcuts:
  toggle_animation: "Space"
  increase_speed: "ArrowUp"
  decrease_speed: "ArrowDown"
  change_theme: "T"
  toggle_sound: "M"
  
performance_settings:
  fps_limit: 60
  use_requestAnimationFrame: true
  optimize_mobile: true
  reduce_effects_on_battery: true