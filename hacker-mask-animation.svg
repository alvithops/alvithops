<svg width="900" height="500" viewBox="0 0 900 500"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <filter id="neon">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>

    <!-- FACE MASK -->
    <mask id="faceMask">
      <rect width="100%" height="100%" fill="white"/>
      <ellipse cx="450" cy="240" rx="120" ry="150" fill="black"/>
    </mask>
  </defs>

  <!-- BACKGROUND -->
  <rect width="100%" height="100%" fill="black"/>

  <!-- RANDOM BINARY COLUMNS -->
  <g mask="url(#faceMask)" fill="#00ff66"
     font-family="monospace" font-size="16"
     filter="url(#neon)">

    <!-- Column 1 -->
    <text x="40" y="-200">101010101010
      <animateTransform type="translate"
        from="0 -500" to="0 700"
        dur="6s" begin="0s"
        repeatCount="indefinite"/>
    </text>

    <!-- Column 2 -->
    <text x="120" y="-300">010011001100
      <animateTransform type="translate"
        from="0 -600" to="0 800"
        dur="9s" begin="-3s"
        repeatCount="indefinite"/>
    </text>

    <!-- Column 3 -->
    <text x="220" y="-100">110010101001
      <animateTransform type="translate"
        from="0 -400" to="0 700"
        dur="7s" begin="-5s"
        repeatCount="indefinite"/>
    </text>

    <!-- Column 4 -->
    <text x="340" y="-250">001101010011
      <animateTransform type="translate"
        from="0 -700" to="0 800"
        dur="11s" begin="-1s"
        repeatCount="indefinite"/>
    </text>

    <!-- Column 5 -->
    <text x="520" y="-350">101001110010
      <animateTransform type="translate"
        from="0 -800" to="0 900"
        dur="8s" begin="-6s"
        repeatCount="indefinite"/>
    </text>

    <!-- Column 6 (UPWARD) -->
    <text x="680" y="700">010101010101
      <animateTransform type="translate"
        from="0 700" to="0 -800"
        dur="10s" begin="-2s"
        repeatCount="indefinite"/>
    </text>

  </g>

  <!-- JOKER FACE -->
  <ellipse cx="450" cy="240" rx="120" ry="150"
           fill="#050505"
           stroke="#00ff66"
           stroke-width="2"/>

  <!-- EYES -->
  <rect x="395" y="220" width="30" height="8" fill="#00ff66"/>
  <rect x="475" y="220" width="30" height="8" fill="#00ff66"/>

  <!-- SMILE -->
  <path d="M410 295 Q450 320 490 295"
        stroke="#00ff66"
        stroke-width="2"
        fill="none"/>

  <!-- FOOTER -->
  <text x="270" y="470"
        fill="#00ff66"
        font-family="monospace"
        font-size="16">
    WELCOME, alvithops — SYSTEM ONLINE
  </text>

</svg>
